<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Simple RAG Chatbot</title>
<style>
  :root {
    --ink: #10131a;
    --surface: #171b24;
    --line: #2a2f3a;
    --paper: #e9e7e2;
    --muted: #8b8f9c;
    --signal: #5b7fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    background: var(--ink);
    color: var(--paper);
    height: 100vh;
    display: flex;
  }
  aside {
    width: 260px;
    border-right: 1px solid var(--line);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  aside h1 {
    font-size: 18px;
    font-style: italic;
    font-weight: 500;
    margin: 0 0 4px 0;
  }
  aside p.tag {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 12px 0;
  }
  .upload-box {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 12px;
    text-align: center;
  }
  .upload-box button {
    background: none;
    border: none;
    color: var(--signal);
    font-size: 13px;
    cursor: pointer;
  }
  #docList {
    flex: 1;
    overflow-y: auto;
    font-size: 12px;
    color: var(--muted);
  }
  #docList div { padding: 4px 0; border-bottom: 1px solid var(--line); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 6px; line-height: 1.5; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--signal); color: white; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
  .msg .sources { margin-top: 6px; font-size: 11px; color: var(--muted); }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 32px;
    border-top: 1px solid var(--line);
  }
  input[type=text] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--paper);
    font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--signal); }
  button.send {
    background: var(--signal);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  .empty { color: var(--muted); text-align: center; margin-top: 80px; font-size: 14px; }
</style>
</head>
<body>

<aside>
  <div>
    <h1>Simple RAG</h1>
    <p class="tag">Gemini-powered document Q&amp;A</p>
  </div>
  <div class="upload-box">
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.csv" style="display:none" />
    <button onclick="document.getElementById('fileInput').click()">+ Upload a document</button>
  </div>
  <div id="docList"></div>
</aside>

<main>
  <div id="messages"><div class="empty">Upload a document and ask a question about it.</div></div>
  <form id="chatForm">
    <input type="text" id="input" placeholder="Ask a question…" autocomplete="off" />
    <button class="send" type="submit">Send</button>
  </form>
</main>

<script>
const sessionId = localStorage.getItem("rag_session") || crypto.randomUUID();
localStorage.setItem("rag_session", sessionId);

const messagesEl = document.getElementById("messages");
const formEl = document.getElementById("chatForm");
const inputEl = document.getElementById("input");
const fileInput = document.getElementById("fileInput");
const docList = document.getElementById("docList");

function addMessage(role, content, sources) {
  messagesEl.querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = content;
  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "sources";
    s.textContent = `${sources.length} source chunk(s) used`;
    div.appendChild(s);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadDocuments() {
  const res = await fetch("/api/documents");
  const docs = await res.json();
  docList.innerHTML = docs.map(d => `<div>${d.filename}</div>`).join("") || "<div>No documents yet.</div>";
}

async function loadHistory() {
  const res = await fetch(`/api/chat/${sessionId}/history`);
  const history = await res.json();
  history.forEach(m => addMessage(m.role, m.content));
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const res = await fetch("/api/documents/upload", { method: "POST", body: formData });
  if (res.ok) {
    await loadDocuments();
  } else {
    const err = await res.json();
    alert("Upload failed: " + err.detail);
  }
  fileInput.value = "";
});

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = inputEl.value.trim();
  if (!message) return;
  addMessage("user", message);
  inputEl.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message }),
  });
  const data = await res.json();
  addMessage("assistant", data.reply, data.sources);
});

loadDocuments();
loadHistory();
</script>

</body>
</html>
