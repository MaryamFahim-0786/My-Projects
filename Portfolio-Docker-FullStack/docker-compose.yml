services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: portfolio_postgres
    restart: unless-stopped
    ports:
      # Host port only matters if you want to connect with a DB tool (pgAdmin, DBeaver).
      # The backend uses the internal network (postgres:5432), so a different host
      # port avoids clashing with other local Postgres containers (e.g. your Meridian DB).
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for chat history
  redis:
    image: redis:alpine
    container_name: portfolio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Always talk to the Compose services by name, even if backend/.env
      # contains a different DATABASE_URL / REDIS_URL (e.g. a cloud one).
      # This fixes: "No address associated with hostname" at startup.
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-portfolio_db}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      # Mount source code for hot reload during development
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - portfolio_network
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  portfolio_network:
    driver: bridge
